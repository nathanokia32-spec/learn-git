<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple Quiz App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>Quick Quiz</h1>

      <section id="quiz" class="card">
        <div id="progress" class="progress">
          Question <span id="qNum">1</span> / <span id="qTotal">1</span>
        </div>

        <div id="question" class="question">Loading...</div>

        <div id="choices" class="choices" role="list"></div>

        <div class="controls">
          <button id="nextBtn" class="btn" disabled>Next</button>
          <button id="restartBtn" class="btn ghost" hidden>Restart</button>
        </div>
      </section>

      <section id="results" class="card hidden">
        <h2>Results</h2>
        <p id="scoreText"></p>
        <button id="tryAgain" class="btn">Try Again</button>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
